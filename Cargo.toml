[package]
name = "sleep-on-time"
version = "0.1.0"
edition = "2024"
description = "System tray app that puts the computer to sleep after a timer or at a fixed time"

[dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.46"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
