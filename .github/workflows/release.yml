name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Run tests
        run: cargo test --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          set -euxo pipefail
          pkg="sleep-on-time-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$pkg/assets"
          cp "target/${{ matrix.target }}/release/sleep-on-time" "dist/$pkg/"
          cp install-linux.sh sleep-on-time.desktop "dist/$pkg/"
          cp assets/icon-light.svg assets/icon-dark.svg assets/icon-active.svg "dist/$pkg/assets/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          sha256sum "dist/$pkg.tar.gz" | tee "dist/$pkg.tar.gz.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true
          fail_on_unmatched_files: true